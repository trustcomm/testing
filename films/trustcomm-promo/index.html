<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap-3.14.2.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FAF9F5;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="2.5"
        data-track-index="1"
      ></div>

      <div
        id="el-02-qr"
        class="scene"
        data-composition-id="02-qr"
        data-composition-src="compositions/frames/02-qr.html"
        data-start="2.5"
        data-duration="2"
        data-track-index="1"
      ></div>

      <div
        id="el-03-rate"
        class="scene"
        data-composition-id="03-rate"
        data-composition-src="compositions/frames/03-rate.html"
        data-start="4.5"
        data-duration="3"
        data-track-index="1"
      ></div>

      <div
        id="el-04-choice"
        class="scene"
        data-composition-id="04-choice"
        data-composition-src="compositions/frames/04-choice.html"
        data-start="7.5"
        data-duration="2.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-chorus"
        class="scene"
        data-composition-id="05-chorus"
        data-composition-src="compositions/frames/05-chorus.html"
        data-start="10"
        data-duration="2.5"
        data-track-index="1"
      ></div>

      <div
        id="el-06-cta"
        class="scene"
        data-composition-id="06-cta"
        data-composition-src="compositions/frames/06-cta.html"
        data-start="12.5"
        data-duration="2.5"
        data-track-index="1"
      ></div>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/score.wav"
        data-start="0"
        data-duration="15"
        data-track-index="11"
        data-volume="1"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
