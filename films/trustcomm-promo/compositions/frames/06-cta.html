  <script src="assets/vendor/gsap-3.14.2.min.js"></script>
  <script>
    (function () {
      var FRAME = "06-cta";
      var DURATION = 2.5;

      // look elements up under this frame's stage clip (class names carry the frame prefix)
      var stage = document.getElementById("06-cta-stage");
      var all = function (scope, cls) {
        return Array.prototype.slice.call(scope.querySelectorAll("." + CSS.escape(cls)));
      };
      var one = function (cls) {
        return all(stage, cls)[0];
      };
      var world = one("06-cta-world");
      var barsEl = one("06-cta-bars");
      var glow = one("06-cta-glow");
      var markEl = one("06-cta-mark");
      var btn = one("06-cta-btn");
      var note = one("06-cta-note");
      var urlText = one("06-cta-urltext");
      var caret = one("06-cta-caret");

      // ---- voice bars: rebuild the handoff (41 bars, x = 960 + (k - 20) * 21.6, h 120, centred y 640) ----
      var BAR_COUNT = 41;
      var LOUD = 26;
      var bars = [];
      for (var k = 0; k < BAR_COUNT; k++) {
        var slot = document.createElement("div");
        slot.className = "06-cta-slot";
        slot.style.left = (960 + (k - 20) * 21.6 - 11).toFixed(2) + "px";
        var bar = document.createElement("div");
        bar.className = k === LOUD ? "06-cta-bar 06-cta-loud" : "06-cta-bar";
        slot.appendChild(bar);
        barsEl.appendChild(slot);
        bars.push({ slot: slot, bar: bar, k: k });
      }

      var tl = gsap.timeline({ paused: true });

      // ---- camera: 1.04 -> 1.00 about (960, 640), 0.00-0.75 ----
      tl.fromTo(world, { scale: 1.04 }, { scale: 1, duration: 0.75, ease: "power2.inOut" }, 0);

      // ---- Scene 1a: headline + sub-line clear upward in a 0.25 s waterfall ----
      var headWords = all(world, "06-cta-head")[0].querySelectorAll("." + CSS.escape("06-cta-w"));
      var subWords = all(world, "06-cta-sub")[0].querySelectorAll("." + CSS.escape("06-cta-w"));
      var clearWord = function (el, at) {
        tl.fromTo(el, { y: 0, filter: "blur(0px)" }, { y: -50, filter: "blur(10px)", duration: 0.16, ease: "power2.in" }, at);
        tl.fromTo(el, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power1.in" }, at);
      };
      for (var i = 0; i < headWords.length; i++) clearWord(headWords[i], i * 0.018);
      for (var j = 0; j < subWords.length; j++) clearWord(subWords[j], 0.03 + j * 0.015);

      // ---- Scene 1b: bars rush (expo.in) into a tight vertical bundle at (960, 470) by 0.25 ----
      bars.forEach(function (b) {
        var d = b.k - 20;
        var bundleH = Math.round(72 + 68 * Math.exp(-Math.pow(d / 9, 2)));
        tl.fromTo(b.slot, { x: 0, y: 0 }, { x: d * (1.8 - 21.6), y: -170, duration: 0.25, ease: "expo.in" }, 0);
        tl.fromTo(b.bar, { height: 120 }, { height: bundleH, duration: 0.25, ease: "power2.in" }, 0);
      });
      // the red bar is absorbed like the others, turning primary as it merges
      tl.fromTo(bars[LOUD].bar, { backgroundColor: "#dc2626" }, { backgroundColor: "#1E5EFE", duration: 0.15, ease: "power2.in" }, 0.1);
      // the bundle is consumed by the flash
      tl.fromTo(barsEl, { opacity: 1 }, { opacity: 0, duration: 0.06, ease: "power1.in" }, 0.25);

      // ---- 0.25 beat hit: one-shot white glow bloom, 0 -> 0.9 -> 0 over 0.3 s ----
      tl.fromTo(glow, { opacity: 0, scale: 0.5 }, { opacity: 0.9, scale: 0.85, duration: 0.06, ease: "power2.out" }, 0.25);
      tl.to(glow, { opacity: 0, scale: 1.2, duration: 0.24, ease: "power2.out" }, 0.31);

      // closing rings ride out of the burst and settle (static by 1.3)
      all(world, "06-cta-ring").forEach(function (ring, r) {
        tl.fromTo(ring, { scale: 0.55, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.9, ease: "expo.out" }, 0.27 + r * 0.05);
      });

      // ---- the wordmark bursts out letter by letter, centre outward, 0.025 s stagger ----
      // ink centres (x) of t r u s t c o m m with the word's ink centred on x = 960
      var INK_CX = [435.7, 522.39, 624.79, 743.5, 836.09, 934.29, 1052.7, 1217.89, 1425.29];
      var letters = all(markEl, "06-cta-L");
      var order = INK_CX.map(function (cx, idx) { return { idx: idx, dist: Math.abs(cx - 960) }; })
        .sort(function (a, b) { return a.dist - b.dist; });
      order.forEach(function (o, rank) {
        var L = letters[o.idx];
        var g = L.querySelector("." + CSS.escape("06-cta-g"));
        var pill = L.querySelector("." + CSS.escape("06-cta-pill"));
        var at = 0.25 + rank * 0.025;
        // appears as a 22 px pill at the centre (the pop completes just before `at`, so the
        // frame that lands on `at` always shows it, with no float ambiguity at the boundary)...
        tl.fromTo(L, { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, at - 0.002);
        // ...scatters outward to its slot on expo.out...
        tl.fromTo(L, { x: 960 - INK_CX[o.idx] }, { x: 0, duration: 0.55, ease: "expo.out" }, at);
        // ...and morphs into its glyph (opacity + scale-x 0.2 -> 1) as the pill dissolves
        tl.fromTo(g, { opacity: 0.2, scaleX: 0.2 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "expo.out" }, at);
        tl.fromTo(pill, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power1.out" }, at + 1 / 60);
      });

      // ---- Scene 2: CTA pill springs up at 1.00 (smooth settle, no overshoot) ----
      tl.fromTo(btn, { scale: 0, opacity: 0, y: 24 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.0);
      // 1.25 "No card needed" fades up beneath it
      tl.fromTo(note, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.25);

      // ---- Scene 3: 1.50 "trustcomm.app" types on (discrete states, 0.25 s), then everything holds ----
      var F = 1 / 60;
      var URL_SEQ = [
        { t: 0, text: "" },
        { t: 1.5, text: "t" },
        { t: 1.5 + 2 * F, text: "tru" },
        { t: 1.5 + 4 * F, text: "trust" },
        { t: 1.5 + 6 * F, text: "trustc" },
        { t: 1.5 + 8 * F, text: "trustcom" },
        { t: 1.5 + 10 * F, text: "trustcomm" },
        { t: 1.5 + 13 * F, text: "trustcomm." },
        { t: 1.75, text: "trustcomm.app" }
      ];
      var CARET_ON = 1.5;
      var CARET_OFF = 1.75 + 2 * F;
      var EPS = 1e-4;
      var textAt = function (time) {
        for (var s = URL_SEQ.length - 1; s >= 0; s--) {
          if (time + EPS >= URL_SEQ[s].t) return URL_SEQ[s].text;
        }
        return "";
      };
      var driver = { t: 0 };
      tl.fromTo(driver, { t: 0 }, {
        t: DURATION,
        duration: DURATION,
        ease: "none",
        onUpdate: function () {
          var now = driver.t;
          urlText.textContent = textAt(now);
          caret.style.opacity = now + EPS >= CARET_ON && now + EPS < CARET_OFF ? "1" : "0";
        }
      }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME] = tl;
    })();
