      var QR = window.QR_TRUSTCOMM || ["1111111001101100001111111","1000001001001111101000001","1011101011100001101011101","1011101011001110001011101","1011101010110000101011101","1000001011100001101000001","1111111010101010101111111","0000000011101011100000000","1011111000010110001111100","1000010110010010110100010","1010001100100001101001011","1010000001110000100100001","1000001100001110011110111","1101010100100010110101010","1011111011111001111111011","1000100010110000011110001","1001101100110001111110100","0000000010101101100011000","1111111000000110101010111","1000001011001100100011011","1011101010001011111110111","1011101011000001011011111","1011101010111000010001101","1000001001110010101111001","1111111011110000010111111"];

        ring.className = "02-qr-ring";
        ring.style.left = (ox - 44.5) + "px";
        ring.style.top = (oy - 44.5) + "px";
        stage.appendChild(ring);
        rings.push(ring);
        var eye = document.createElement("div");
        eye.className = "02-qr-eye";
        eye.style.left = (ox - 19.5) + "px";
        eye.style.top = (oy - 19.5) + "px";
        stage.appendChild(eye);
        eyes.push(eye);
      });

      var tl = gsap.timeline({ paused: true });

      // ================= Scene 1 (0.00–0.50): bars leap, split into a 3D module cloud =================
      var bars = byClass("bar");
      var loud = byId("bar-loud");
      tl.fromTo(loud, { scaleY: 1, opacity: 1 }, { scaleY: 0, opacity: 0, duration: 0.2, ease: "power2.out" }, 0);

      var quiet = bars.filter(function (b) { return b !== loud; }); // 12 bars, left → right
      var splits = [];
      quiet.forEach(function (bar, b) {
        var i = b < 6 ? b : b + 1;
        var sx = 960 + (i - 6) * 36;
        var px = sx + 0.55 * (CX - sx);
        var py = 640 + 0.55 * (CY - 640) - 70 - 25 * Math.sin(Math.PI * b / 11);
        var ts = 0.22 + 0.006 * b;
        splits.push({ x: px, y: py, t: ts });
        // turn voiced on the downbeat
        tl.fromTo(bar, { opacity: 0.18 }, { opacity: 1, duration: 0.08, ease: "power1.out" }, 0);
        // leap: x lags (sine.in) while y rises fast (power2.out) → an arc up and over toward the QR
        tl.fromTo(bar, { x: 0, rotation: 0 }, { x: px - sx, rotation: -(sx - px) / 10, duration: ts, ease: "sine.in" }, 0);
        tl.fromTo(bar, { y: 0 }, { y: py - 640, duration: ts, ease: "power2.out" }, 0);
        tl.fromTo(bar, { scaleY: 1 }, { scaleY: 2.6, duration: 0.14, ease: "power2.out" }, 0);
        // mid-flight split: the bar collapses as its modules burst out
        tl.fromTo(bar, { scaleY: 2.6, scaleX: 1, opacity: 1 },
          { scaleY: 0.3, scaleX: 0.5, opacity: 0, duration: 0.07, ease: "power2.in", immediateRender: false }, ts - 0.03);
      });

      // depth-scatter cloud points: index-derived (golden angle + stepped depth), no randomness
      var GOLDEN = Math.PI * (3 - Math.sqrt(5));
      var n = mods.length;           // 328
      var DMAX = Math.sqrt(2) * MID;
      mods.forEach(function (m, k) {
        var j = (k * 97) % n, jd = (k * 61) % n;
        var a = j * GOLDEN, a2 = jd * GOLDEN;
        var rad = 175 * Math.sqrt((j + 0.5) / n);
        m.cx = m.tx * 0.22 + Math.cos(a) * rad;
        m.cy = m.ty * 0.22 + Math.sin(a) * rad * 0.85;
        m.cz = 170 - (jd / (n - 1)) * 430;      // +170 … −260: a shallow depth cloud
        m.rx = Math.sin(a2) * 68;
        m.ry = Math.cos(a) * 68;
        m.rz = ((k % 9) - 4) * 11;

        var sp = splits[k % 12];
        var burstAt = sp.t - 0.02 + ((k * 7) % 5) * 0.006;
        tl.fromTo(m.el,
          { x: sp.x - CX, y: sp.y - CY, z: 0, rotationX: 0, rotationY: 0, rotation: 0, scale: 0.45, opacity: 0, backgroundColor: "#1E5EFE" },
          { x: m.cx, y: m.cy, z: m.cz, rotationX: m.rx, rotationY: m.ry, rotation: m.rz, scale: 1, opacity: 1, duration: 0.2, ease: "power2.out" },
          burstAt);

        // ============ Scene 2: centre-outward cascade into exact cells, 0.50 → 1.00 ============
        var d = Math.sqrt((m.c - MID) * (m.c - MID) + (m.r - MID) * (m.r - MID));
        var landAt = 0.5 + 0.25 * (d / DMAX);
        tl.fromTo(m.el,
          { x: m.cx, y: m.cy, z: m.cz, rotationX: m.rx, rotationY: m.ry, rotation: m.rz, backgroundColor: "#1E5EFE" },
          { x: m.tx, y: m.ty, z: 0, rotationX: 0, rotationY: 0, rotation: 0, backgroundColor: "#111216", duration: 0.25, ease: "power3.out", immediateRender: false },
          landAt);
      });

      // the cloud breathes in 3D, then resolves flat by 1.00
      tl.fromTo(stage, { rotationY: 0, rotationX: 0 }, { rotationY: 22, rotationX: -10, duration: 0.38, ease: "sine.inOut" }, 0.22);
      tl.fromTo(stage, { rotationY: 22, rotationX: -10 }, { rotationY: 0, rotationX: 0, duration: 0.4, ease: "power2.inOut", immediateRender: false }, 0.6);

      // ================= Scene 2 (0.50–1.25) =================
      tl.fromTo(byId("card"), { scale: 0.92, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.5);

      // finder rings snap last, contact at 1.00
      var finderShapes = rings.concat(eyes);
      tl.fromTo(finderShapes, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "power1.out" }, 0.9);
      tl.fromTo(finderShapes, { scale: 1.35 }, { scale: 1, duration: 0.1, ease: "power2.in" }, 0.9);
      var finderMods = mods.filter(function (m) { return m.finder; }).map(function (m) { return m.el; });
      tl.set(finderMods, { opacity: 0, immediateRender: false }, 1.0);

      // shop label rises in at 1.00
      tl.fromTo(byId("shop"), { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 1.0);
      tl.fromTo(byId("tagline"), { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 1.06);

      // headline per line: line 1 at 0.50, line 2 at 0.75 — words slide up 30 px
      var lines = byClass("line");
      [0.5, 0.75].forEach(function (at, li) {
        var words = Array.prototype.slice.call(lines[li].getElementsByClassName("02-qr-word"));
        words.forEach(function (w, wi) {
          tl.fromTo(w, { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, at + wi * 0.05);
        });
      });

      // ================= Scene 3 (1.25–2.00): phone rises and scans =================
      tl.fromTo(byId("phone"), { y: 1020 }, { y: 0, duration: 0.25, ease: "expo.out" }, 1.25);

      // viewfinder brackets snap inward onto the QR, contact at 1.50
      var brackets = [[byId("br-tl"), -22, -22], [byId("br-tr"), 22, -22], [byId("br-bl"), -22, 22], [byId("br-br"), 22, 22]];
      brackets.forEach(function (bk) {
        tl.fromTo(bk[0], { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "power1.out" }, 1.38);
        tl.fromTo(bk[0], { x: bk[1], y: bk[2] }, { x: 0, y: 0, duration: 0.12, ease: "power2.in" }, 1.38);
      });

      // scan line sweeps the QR top → bottom, 1.50 → 1.70
      var scan = byId("scan");
      tl.fromTo(scan, { y: 0 }, { y: 325, duration: 0.2, ease: "sine.inOut" }, 1.5);
      tl.fromTo(scan, { opacity: 0 }, { opacity: 1, duration: 0.03, ease: "none" }, 1.5);
      tl.fromTo(scan, { opacity: 1 }, { opacity: 0, duration: 0.05, ease: "power1.out", immediateRender: false }, 1.68);

      // 1.75 flash: 0 → 1 → 0 over 0.15 s; rating page takes the screen at the peak
      var flash = byId("flash");
      tl.fromTo(flash, { opacity: 0 }, { opacity: 1, duration: 0.075, ease: "power1.out" }, 1.75);
      tl.fromTo(flash, { opacity: 1 }, { opacity: 0, duration: 0.075, ease: "power1.in", immediateRender: false }, 1.825);
      tl.fromTo(byId("page"), { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 1.815);

      // counter card tucks away behind the phone: opacity 0 by 2.00 (handoff)
      tl.fromTo(byId("counter"), { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.94, duration: 0.125, ease: "power2.out", immediateRender: false }, 1.825);

      // right-column chips spring in on half-beats (smooth, no overshoot)
      tl.fromTo(byId("pill-app"), { scale: 0, opacity: 0, y: 12 }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 1.5);
      tl.fromTo(byId("pill-signin"), { scale: 0, opacity: 0, y: 12 }, { scale: 1, opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 1.75);

      window.__timelines = window.__timelines || {};
      window.__timelines["02-qr"] = tl;
    })();
  </script>
</template>
