<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Leader — Showreel 2026</title>
    <script src="assets/vendor/gsap-3.14.2.min.js"></script>
    <style>
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/archivo-latin-standard-normal.woff2") format("woff2");
        font-weight: 100 900;
        font-stretch: 62% 125%;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("assets/fonts/geist-mono-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #06070b;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #06070b;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-fps="60" data-duration="15">
      <canvas id="stage" width="1920" height="1080" data-layout-allow-overflow></canvas>
      <audio id="score" src="assets/audio/score.wav" data-start="0" data-duration="15" data-track-index="10"></audio>
    </div>
    <script>
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__timelines = window.__timelines || {};
      // Three.js is an ES module; import it relative to this document so the path holds wherever the page is served.
      window.__THREE = import("./assets/vendor/three.module.min.js");
    </script>
    <script src="src/cues.js"></script>
    <script src="src/engine/util.js"></script>
    <script src="src/data/glyphs.js"></script>
    <script src="src/engine/glyph.js"></script>
    <script src="src/engine/gl.js"></script>
    <script src="src/engine/shared.js"></script>
    <script src="src/worlds/fluid.js"></script>
    <script src="src/worlds/forge.js"></script>
    <script src="src/worlds/glass.js"></script>
    <script src="src/worlds/geometry.js"></script>
    <script src="src/worlds/type.js"></script>
    <script src="src/worlds/flight.js"></script>
    <script src="src/worlds/lockup.js"></script>
    <script src="src/worlds/overlay.js"></script>
    <script src="src/reel.js"></script>
    <script>
      // Register the root timeline only once the async build (fonts, WebGL, glyph fields) has finished.
      window.__hf.buildReady["reel"] = (async () => {
        const { tl } = await window.__reelBuild();
        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      })();
    </script>
  </body>
</html>
