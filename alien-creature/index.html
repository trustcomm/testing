<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Xenoform</title>
<style>
  @font-face { font-family: "Plex Mono"; font-weight: 400; src: url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Plex Mono"; font-weight: 600; src: url(fonts/ibm-plex-mono-latin-600-normal.woff2) format("woff2"); }
  html, body { margin: 0; background: #030405; }
  canvas { display: block; }
  #gl { display: none; }
  #c { height: 100vh; width: auto; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="c"></canvas>
<script type="module">
import { T } from './tokens.js';
import { COUNTS, totalPoints, vertexShader, fragmentShader } from './creature.js';
import { createGL, program, createPost, runPost } from './engine/gl.js';
import { drawType, drawGuides } from './engine/type.js';

const q = new URLSearchParams(location.search);
const SS = Math.max(1, Number(q.get('ss') || 1));
const RENDER = q.has('render');
const W = T.W * SS, H = T.H * SS;

const glc = document.getElementById('gl');
const out = document.getElementById('c');
glc.width = out.width = W;
glc.height = out.height = H;
const ctx = out.getContext('2d');
const gl = createGL(glc);

const N = totalPoints();
const pts = program(gl, vertexShader(COUNTS), fragmentShader);
const post = createPost(gl, W, H);
const vao = gl.createVertexArray();
const copy = await (await fetch('copy.json')).json();

const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
const lin = (hex) => rgb(hex).map((c) => Math.pow(c, 2.2));

// column-major perspective · lookAt
function viewProj(eye, target, fovDeg, aspect) {
  const f = 1 / Math.tan((fovDeg * Math.PI) / 360), n = 0.1, fa = 100;
  const sub = (a, b) => a.map((x, i) => x - b[i]);
  const norm = (a) => { const l = Math.hypot(...a); return a.map((x) => x / l); };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const z = norm(sub(eye, target)), x = norm(cross([0, 1, 0], z)), y = cross(z, x);
  const V = [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot(x, eye), -dot(y, eye), -dot(z, eye), 1];
  const P = [f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (fa + n) / (n - fa), -1, 0, 0, (2 * fa * n) / (n - fa), 0];
  const M = new Array(16).fill(0);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) for (let k = 0; k < 4; k++) M[c * 4 + r] += P[k * 4 + r] * V[c * 4 + k];
  return M;
}

// Camera: slow orbit and a gentle push, all periodic in the loop phase.
function camera(P) {
  const c = T.cam;
  const az = 0.5 * Math.sin(P), el = 0.16 + 0.08 * Math.sin(2 * P);
  const d = c.dist * (1 - 0.03 * (0.5 - 0.5 * Math.cos(P)));
  const tg = c.target;
  return [tg[0] + d * Math.cos(el) * Math.sin(az), tg[1] + d * Math.sin(el), tg[2] + d * Math.cos(el) * Math.cos(az)];
}

window.DURATION = T.DURATION;
window.FPS = T.FPS;
window.POINTS = N;

window.renderFrame = async function renderFrame(t) {
  const P = (2 * Math.PI * t) / T.DURATION;
  const eye = camera(P);
  const pxPerUnit = H / (2 * Math.tan((T.cam.fov * Math.PI) / 360));

  gl.bindFramebuffer(gl.FRAMEBUFFER, post.scene.fb);
  gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(pts.p);
  const u = pts.u;
  gl.uniform1f(u.uP, P);
  gl.uniformMatrix4fv(u.uVP, false, viewProj(eye, T.cam.target, T.cam.fov, W / H));
  gl.uniform3fv(u.uCam, eye);
  gl.uniform1f(u.uPx, pxPerUnit);
  gl.uniform1f(u.uFocus, T.cam.focus);
  gl.uniform1f(u.uAperture, T.cam.aperture);
  gl.uniform1f(u.uSS, SS);
  gl.uniform3fv(u.uInk, lin(T.color.ink));
  gl.uniform3fv(u.uAccent, lin(T.color.accent));
  gl.uniform3fv(u.uGlow, lin(T.color.glow));
  gl.bindVertexArray(vao);
  gl.drawArrays(gl.POINTS, 0, N);

  runPost(gl, post, {
    thresh: T.post.bloomThresh, bloom: T.post.bloomStrength, exposure: T.post.exposure,
    ca: T.post.ca, vignette: T.post.vignette, grain: T.post.grain, ss: SS,
    frame: Math.round(t * T.FPS), aspect: W / H, bg: rgb(T.color.bg), bg2: rgb(T.color.bg2),
  });
  gl.finish();

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(glc, 0, 0);
  ctx.setTransform(SS, 0, 0, SS, 0, 0);
  drawType(ctx, copy, t % T.DURATION, N);
  if (q.has('guides')) drawGuides(ctx);
};

await Promise.all([
  document.fonts.load(`400 34px "${T.font.mono}"`),
  document.fonts.load(`600 30px "${T.font.mono}"`),
]);
await document.fonts.ready;
window.READY = true;

if (!RENDER) {
  const t0 = performance.now();
  const loop = async () => {
    await window.renderFrame((((performance.now() - t0) / 1000) % T.DURATION));
    requestAnimationFrame(loop);
  };
  loop();
}
</script>
</body>
</html>
